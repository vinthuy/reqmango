[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "reqmango"
version = "0.1.0"
description = "Python SDK for the reqmango project management API"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "respx>=0.22",
]
