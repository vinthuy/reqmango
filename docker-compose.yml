services:
  db:
    image: postgres:16-alpine
    container_name: reqmango-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-reqmango}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-reqmango}
      POSTGRES_DB: ${DB_NAME:-reqmango}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-reqmango}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    container_name: reqmango-backend
    restart: unless-stopped
    ports:
      - "${API_PORT:-8000}:8000"
    environment:
      DATABASE_URL: "postgres://${DB_USER:-reqmango}:${DB_PASSWORD:-reqmango}@db:5432/${DB_NAME:-reqmango}?sslmode=disable"
      SECRET_KEY: ${SECRET_KEY:-change-me-in-production}
      ACCESS_TOKEN_EXPIRE_MINUTES: "${ACCESS_TOKEN_EXPIRE_MINUTES:-10080}"
      PORT: "8000"
      DEBUG: "${DEBUG:-false}"
      AI_API_KEY: ${AI_API_KEY:-}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      AI_MODEL: ${AI_MODEL:-deepseek-chat}
      AI_BASE_URL: ${AI_BASE_URL:-https://api.deepseek.com/v1}
      AI_PROVIDER: ${AI_PROVIDER:-deepseek}
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    container_name: reqmango-frontend
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-80}:80"
    depends_on:
      - backend

volumes:
  pgdata:
