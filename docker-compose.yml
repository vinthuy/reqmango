services:
  db:
    image: postgres:16-alpine
    container_name: reqmanpy-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-reqmanpy}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-reqmanpy}
      POSTGRES_DB: ${DB_NAME:-reqmanpy}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-reqmanpy}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend-go
    container_name: reqmanpy-backend
    restart: unless-stopped
    ports:
      - "${API_PORT:-8000}:8000"
    environment:
      DATABASE_URL: "postgres://${DB_USER:-reqmanpy}:${DB_PASSWORD:-reqmanpy}@db:5432/${DB_NAME:-reqmanpy}?sslmode=disable"
      SECRET_KEY: ${SECRET_KEY:-change-me-in-production}
      ACCESS_TOKEN_EXPIRE_MINUTES: "${ACCESS_TOKEN_EXPIRE_MINUTES:-10080}"
      PORT: "8000"
      DEBUG: "${DEBUG:-false}"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    container_name: reqmanpy-frontend
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-80}:80"
    depends_on:
      - backend

volumes:
  pgdata:
