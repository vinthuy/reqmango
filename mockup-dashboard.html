<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Custom Analytics Pro — Dashboard Editor (Hi-Fi Mockup)</title>
<script src="https://unpkg.com/vue@3.4/dist/vue.global.prod.js"></script>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background:#f8f9fa; color:#1a1a2e; }
  
  /* Top bar */
  .topbar { height:48px; background:#fff; border-bottom:1px solid #e5e7eb; display:flex; align-items:center; padding:0 20px; gap:12px; position:sticky; top:0; z-index:100; }
  .topbar .breadcrumb { font-size:13px; color:#6b7280; }
  .topbar .breadcrumb span { color:#374151; font-weight:500; }
  .topbar .spacer { flex:1; }
  .btn { padding:6px 14px; border-radius:6px; font-size:13px; font-weight:500; cursor:pointer; border:none; transition:all .15s; }
  .btn-ghost { background:transparent; color:#6b7280; border:1px solid #d1d5db; }
  .btn-ghost:hover { background:#f3f4f6; color:#374151; }
  .btn-primary { background:#111827; color:#fff; }
  .btn-primary:hover { background:#1f2937; }
  .btn-sm { padding:4px 10px; font-size:12px; }

  /* Main layout */
  .main { display:flex; height:calc(100vh - 48px); }
  
  /* Sidebar */
  .sidebar { width:240px; background:#fff; border-right:1px solid #e5e7eb; display:flex; flex-direction:column; }
  .sidebar-header { padding:16px; border-bottom:1px solid #f3f4f6; display:flex; align-items:center; justify-content:space-between; }
  .sidebar-header h3 { font-size:11px; font-weight:600; color:#9ca3af; text-transform:uppercase; letter-spacing:.05em; }
  .sidebar-header .add-btn { width:26px; height:26px; border-radius:6px; background:#f3f4f6; border:none; cursor:pointer; font-size:18px; color:#6b7280; display:flex; align-items:center; justify-content:center; }
  .sidebar-header .add-btn:hover { background:#e5e7eb; color:#374151; }
  .dashboard-item { padding:10px 16px; font-size:13px; color:#374151; cursor:pointer; border-left:3px solid transparent; display:flex; align-items:center; gap:8px; transition:all .1s; }
  .dashboard-item:hover { background:#f9fafb; }
  .dashboard-item.active { background:#eff6ff; border-left-color:#3b82f6; color:#1d4ed8; font-weight:500; }
  .dashboard-item .dot { width:8px; height:8px; border-radius:50%; background:#d1d5db; flex-shrink:0; }
  .dashboard-item.active .dot { background:#3b82f6; }

  /* Canvas area */
  .canvas-area { flex:1; overflow-y:auto; position:relative; }
  .canvas-header { padding:16px 24px; display:flex; align-items:center; gap:12px; border-bottom:1px solid #f3f4f6; background:#fff; }
  .canvas-header h2 { font-size:18px; font-weight:600; flex:1; }
  .canvas-header .mode-badge { font-size:11px; padding:3px 8px; border-radius:4px; font-weight:500; }
  .mode-edit { background:#fef3c7; color:#92400e; }
  .mode-view { background:#dbeafe; color:#1e40af; }

  /* Drag grid */
  .grid-container { padding:20px; min-height:calc(100vh - 120px); position:relative; }
  .grid-layout { 
    display:grid; 
    grid-template-columns:repeat(12, 1fr); 
    gap:16px; 
    grid-auto-rows:minmax(120px, auto);
  }
  .grid-layout.edit-mode .widget { cursor:grab; }
  .grid-layout.edit-mode .widget:active { cursor:grabbing; }

  /* Widget card */
  .widget { 
    background:#fff; border:1px solid #e5e7eb; border-radius:12px; overflow:hidden; 
    transition:box-shadow .2s, border-color .2s; position:relative;
  }
  .widget:hover { box-shadow:0 2px 12px rgba(0,0,0,.06); }
  .edit-mode .widget:hover { border-color:#93c5fd; box-shadow:0 2px 12px rgba(59,130,246,.1); }
  .widget.dragging { opacity:.5; z-index:1000; box-shadow:0 8px 30px rgba(0,0,0,.12); }
  
  .widget-header { padding:10px 14px; border-bottom:1px solid #f3f4f6; display:flex; align-items:center; gap:8px; }
  .widget-header .widget-title { font-size:12px; font-weight:600; color:#374151; flex:1; }
  .widget-header .widget-type { font-size:10px; color:#9ca3af; padding:2px 6px; background:#f3f4f6; border-radius:3px; }
  .widget-header .widget-actions { display:none; gap:4px; }
  .edit-mode .widget-header .widget-actions { display:flex; }
  .widget-header .icon-btn { width:24px; height:24px; border-radius:5px; border:none; background:transparent; cursor:pointer; font-size:13px; color:#9ca3af; display:flex; align-items:center; justify-content:center; }
  .widget-header .icon-btn:hover { background:#f3f4f6; color:#374151; }
  .widget-header .icon-btn.danger:hover { background:#fef2f2; color:#ef4444; }

  .widget-body { padding:14px; min-height:80px; display:flex; align-items:center; justify-content:center; }
  
  /* Resize handle */
  .resize-handle { position:absolute; bottom:0; right:0; width:18px; height:18px; cursor:nwse-resize; opacity:0; }
  .edit-mode .resize-handle { opacity:1; }
  .resize-handle::after { content:''; position:absolute; bottom:3px; right:3px; width:8px; height:8px; border-right:2px solid #cbd5e1; border-bottom:2px solid #cbd5e1; }

  /* Mini chart styles */
  .mini-bar { display:flex; flex-direction:column; gap:5px; width:100%; }
  .mini-bar-row { display:flex; align-items:center; gap:8px; }
  .mini-bar-label { font-size:11px; color:#6b7280; width:80px; text-align:right; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .mini-bar-track { flex:1; height:14px; background:#f3f4f6; border-radius:7px; overflow:hidden; }
  .mini-bar-fill { height:100%; border-radius:7px; transition:width .4s; }
  .mini-bar-val { font-size:11px; color:#374151; font-weight:500; width:24px; }

  .mini-pie { display:flex; align-items:center; gap:16px; }
  .mini-pie svg { width:80px; height:80px; }
  .mini-pie-legend { display:flex; flex-direction:column; gap:4px; }
  .mini-pie-legend-item { display:flex; align-items:center; gap:6px; font-size:11px; color:#6b7280; }
  .mini-pie-dot { width:8px; height:8px; border-radius:50%; }

  .mini-line { width:100%; }
  .mini-line svg { width:100%; height:100px; }

  .mini-table { width:100%; font-size:11px; }
  .mini-table th { text-align:left; padding:4px 8px; color:#9ca3af; font-weight:500; font-size:10px; text-transform:uppercase; letter-spacing:.05em; border-bottom:1px solid #f3f4f6; }
  .mini-table td { padding:4px 8px; color:#374151; border-bottom:1px solid #fafafa; }
  .mini-table td:last-child { text-align:right; font-weight:500; }

  /* Add widget button */
  .add-widget-spot { 
    border:2px dashed #d1d5db; border-radius:12px; min-height:160px; 
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:8px;
    cursor:pointer; color:#9ca3af; transition:all .2s;
    grid-column:span 3;
  }
  .add-widget-spot:hover { border-color:#3b82f6; color:#3b82f6; background:#eff6ff; }
  .add-widget-spot .plus { font-size:28px; line-height:1; }
  .add-widget-spot .label { font-size:12px; font-weight:500; }

  /* Config panel (right slide) */
  .config-overlay { position:fixed; inset:0; background:rgba(0,0,0,.2); z-index:200; }
  .config-panel { position:fixed; top:0; right:0; width:400px; height:100%; background:#fff; box-shadow:-4px 0 20px rgba(0,0,0,.08); z-index:201; display:flex; flex-direction:column; animation:slideIn .2s ease; }
  @keyframes slideIn { from { transform:translateX(100%); } to { transform:translateX(0); } }
  .config-panel-header { padding:16px 20px; border-bottom:1px solid #e5e7eb; display:flex; align-items:center; gap:12px; }
  .config-panel-header h3 { font-size:15px; font-weight:600; flex:1; }
  .config-panel-body { flex:1; overflow-y:auto; padding:20px; display:flex; flex-direction:column; gap:16px; }
  .config-panel-footer { padding:16px 20px; border-top:1px solid #e5e7eb; display:flex; gap:8px; justify-content:flex-end; }
  
  .form-group { display:flex; flex-direction:column; gap:4px; }
  .form-label { font-size:10px; font-weight:600; color:#9ca3af; text-transform:uppercase; letter-spacing:.04em; }
  .form-input, .form-select { padding:7px 10px; border:1px solid #d1d5db; border-radius:6px; font-size:13px; width:100%; }
  .form-input:focus, .form-select:focus { outline:none; border-color:#3b82f6; box-shadow:0 0 0 2px rgba(59,130,246,.15); }
  .toggle-group { display:inline-flex; background:#f3f4f6; border-radius:8px; padding:2px; }
  .toggle-btn { padding:5px 12px; border-radius:6px; font-size:12px; border:none; background:transparent; cursor:pointer; color:#6b7280; }
  .toggle-btn.active { background:#fff; color:#374151; font-weight:500; box-shadow:0 1px 2px rgba(0,0,0,.06); }
  .rql-input { font-family:'SF Mono','Cascadia Code',monospace; font-size:12px; background:#f9fafb; }
  .filter-row { display:flex; gap:6px; align-items:center; }
  .filter-row select { flex:1; }
  .filter-row .remove-btn { background:none; border:none; color:#9ca3af; font-size:16px; cursor:pointer; padding:2px; }
  .filter-row .remove-btn:hover { color:#ef4444; }

  /* Filter chips (Plane style) */
  .filter-chips { display:flex; flex-wrap:wrap; gap:6px; margin-bottom:8px; }
  .filter-chip { 
    display:inline-flex; align-items:center; gap:3px; padding:3px 8px; 
    background:#eef2ff; color:#4338ca; border:1px solid #c7d2fe; border-radius:16px; 
    font-size:11px; cursor:pointer; transition:all .15s;
  }
  .filter-chip:hover { background:#e0e7ff; border-color:#a5b4fc; }
  .filter-chip-label { color:#6b7280; }
  .filter-chip-op { color:#9ca3af; }
  .filter-chip-val { font-weight:500; }
  .filter-chip-close { 
    background:none; border:none; color:#9ca3af; font-size:13px; cursor:pointer; 
    padding:0; line-height:1; margin-left:2px; display:flex; align-items:center;
  }
  .filter-chip-close:hover { color:#ef4444; }

  /* Filter inline editor (Plane style) */
  .filter-editor { 
    display:flex; align-items:center; gap:6px; padding:6px 10px; 
    background:#f9fafb; border:1px solid #e5e7eb; border-radius:8px; margin-bottom:8px;
    flex-wrap:wrap;
  }
  .filter-editor-label { font-size:12px; color:#6b7280; font-weight:500; white-space:nowrap; }
  .filter-add-area {  }
  .filter-add-row { display:flex; align-items:center; gap:6px; }
  .filter-hint { font-size:11px; color:#9ca3af; font-style:italic; display:block; margin-top:6px; }

  /* Empty state */
  .empty-state { text-align:center; padding:60px 20px; color:#9ca3af; }
  .empty-state .icon { font-size:48px; margin-bottom:12px; }
  .empty-state h3 { font-size:16px; color:#6b7280; margin-bottom:6px; }
  .empty-state p { font-size:13px; max-width:360px; margin:0 auto 20px; }

  /* Colors */
  .c1 { background:#3B82F6; } .c2 { background:#10B981; } .c3 { background:#F59E0B; }
  .c4 { background:#EF4444; } .c5 { background:#8B5CF6; } .c6 { background:#EC4899; }
  .c1-fill { fill:#3B82F6; } .c2-fill { fill:#10B981; } .c3-fill { fill:#F59E0B; }
  .c4-fill { fill:#EF4444; } .c5-fill { fill:#8B5CF6; }

  /* Hover info */
  .status-bar { padding:8px 24px; background:#f9fafb; border-bottom:1px solid #f3f4f6; font-size:11px; color:#9ca3af; display:flex; gap:16px; }
  .status-bar strong { color:#374151; }

  .col-span-3 { grid-column:span 3; }
  .col-span-4 { grid-column:span 4; }
  .col-span-6 { grid-column:span 6; }
  .col-span-8 { grid-column:span 8; }
  .col-span-12 { grid-column:span 12; }
</style>
</head>
<body>

<div id="app">
  <!-- Top bar -->
  <div class="topbar">
    <div class="breadcrumb">Workspace <span>›</span> Project <span>›</span> <span>Custom Analytics</span></div>
    <div class="spacer"></div>
    <button class="btn btn-sm btn-ghost" @click="lang = lang === 'en' ? 'zh' : 'en'">{{ lang === 'en' ? '中文' : 'English' }}</button>
    <button v-if="editMode" class="btn btn-ghost" @click="editMode = false; showConfig = false">{{ t('done') }}</button>
    <button v-else class="btn btn-primary" @click="editMode = true">{{ t('editDashboard') }}</button>
  </div>

  <div class="main">
    <!-- Sidebar: Dashboard list -->
    <div class="sidebar">
      <div class="sidebar-header">
        <h3>{{ t('customAnalytics') }}</h3>
        <button class="add-btn" @click="addDashboard">+</button>
      </div>
      <div v-for="(d, i) in dashboards" :key="i"
        class="dashboard-item" 
        :class="{ active: activeDashboard === i }"
        @click="activeDashboard = i; editMode = false"
      >
        <span class="dot"></span>
        {{ d.name }}
      </div>
      <div v-if="dashboards.length === 0" style="padding:16px;font-size:12px;color:#9ca3af;text-align:center;">
        {{ t('noDashboards') }}
      </div>
    </div>

    <!-- Canvas -->
    <div class="canvas-area">
      <div class="canvas-header">
        <h2 v-if="dashboards[activeDashboard]">{{ dashboards[activeDashboard].name }}</h2>
        <h2 v-else style="color:#d1d5db;">{{ t('selectDashboard') }}</h2>
        <span class="mode-badge" :class="editMode ? 'mode-edit' : 'mode-view'">{{ editMode ? t('editing') : t('viewing') }}</span>
      </div>

      <template v-if="dashboards[activeDashboard]">
        <!-- Status bar -->
        <div class="status-bar">
          <span>{{ t('widgets') }}: <strong>{{ dashboards[activeDashboard].widgets.length }}</strong></span>
          <span v-if="dashboards[activeDashboard].widgets.length">{{ t('totalIssues') }}: <strong>{{ totalIssues }}</strong></span>
        </div>

        <!-- Widget Grid -->
        <div class="grid-container" v-if="dashboards[activeDashboard].widgets.length > 0">
          <div class="grid-layout" :class="{ 'edit-mode': editMode }">
            <div v-for="(w, wi) in dashboards[activeDashboard].widgets" :key="wi"
              class="widget" :class="getSpanClass(w)"
              :style="getWidgetStyle(w)"
              @mousedown="editMode ? startDrag($event, wi) : null"
            >
              <div class="widget-header">
                <span class="widget-title">{{ w.title || w.report_type }}</span>
                <span class="widget-type">{{ w.chart_type }}</span>
                <div class="widget-actions">
                  <button class="icon-btn" @click.stop="openConfig(wi)" title="Configure">⚙</button>
                  <button class="icon-btn danger" @click.stop="removeWidget(wi)" title="Delete">✕</button>
                </div>
              </div>
              <div class="widget-body">
                <!-- Bar chart -->
                <div v-if="w.chart_type === 'Bar'" class="mini-bar">
                  <div class="mini-bar-row" v-for="(b, bi) in getWidgetBars(w)" :key="bi">
                    <span class="mini-bar-label">{{ b.label }}</span>
                    <div class="mini-bar-track">
                      <div class="mini-bar-fill" :class="'c'+(bi%5+1)" :style="{width: b.pct+'%'}"></div>
                    </div>
                    <span class="mini-bar-val">{{ b.val }}</span>
                  </div>
                </div>
                <!-- Pie chart -->
                <div v-if="w.chart_type === 'Pie'" class="mini-pie">
                  <svg viewBox="0 0 80 80">
                    <circle v-for="(seg, si) in getPieSegments(w)" :key="si" cx="40" cy="40" r="28"
                      fill="none" :stroke="colors[si%5] || '#3B82F6'" stroke-width="18"
                      :stroke-dasharray="seg.dash" :stroke-dashoffset="seg.offset"
                      transform="rotate(-90 40 40)" />
                  </svg>
                  <div class="mini-pie-legend">
                    <div v-for="(b, bi) in getWidgetBars(w).slice(0,4)" :key="bi" class="mini-pie-legend-item">
                      <span class="mini-pie-dot" :class="'c'+(bi%5+1)"></span>
                      {{ b.label }} {{ b.val }}
                    </div>
                  </div>
                </div>
                <!-- Doughnut -->
                <div v-if="w.chart_type === 'Doughnut'" class="mini-pie">
                  <svg viewBox="0 0 80 80">
                    <circle v-for="(seg, si) in getPieSegments(w)" :key="si" cx="40" cy="40" r="28"
                      fill="none" :stroke="colors[si%5] || '#3B82F6'" stroke-width="12"
                      :stroke-dasharray="seg.dash" :stroke-dashoffset="seg.offset"
                      transform="rotate(-90 40 40)" />
                    <text x="40" y="44" text-anchor="middle" font-size="11" font-weight="bold" fill="#374151">{{ getWidgetBars(w).reduce((s,b)=>s+b.val,0) }}</text>
                  </svg>
                  <div class="mini-pie-legend">
                    <div v-for="(b, bi) in getWidgetBars(w).slice(0,4)" :key="bi" class="mini-pie-legend-item">
                      <span class="mini-pie-dot" :class="'c'+(bi%5+1)"></span>
                      {{ b.label }} {{ b.val }}
                    </div>
                  </div>
                </div>
                <!-- Line -->
                <div v-if="w.chart_type === 'Line'" class="mini-line">
                  <svg viewBox="0 0 300 100">
                    <polyline :points="getLinePoints(w)" fill="none" stroke="#3B82F6" stroke-width="2" stroke-linejoin="round" />
                    <circle v-for="(pt, pi) in getLineDots(w)" :key="pi" :cx="pt.x" :cy="pt.y" r="3" fill="#3B82F6" />
                  </svg>
                </div>
                <!-- Table -->
                <table v-if="w.chart_type === 'Table'" class="mini-table">
                  <thead><tr><th>{{ t('group') }}</th><th style="text-align:right">{{ t('count') }}</th></tr></thead>
                  <tbody>
                    <tr v-for="(b, bi) in getWidgetBars(w)" :key="bi">
                      <td>{{ b.label }}</td><td>{{ b.val }}</td>
                    </tr>
                  </tbody>
                </table>
              </div>
              <div class="resize-handle" v-if="editMode" @mousedown.stop="startResize($event, wi)"></div>
            </div>

            <!-- Add widget button -->
            <div class="add-widget-spot" v-if="editMode" @click="addWidget">
              <span class="plus">+</span>
              <span class="label">{{ t('addWidget') }}</span>
            </div>
          </div>
        </div>

        <!-- Empty state -->
        <div class="empty-state" v-else>
          <div class="icon">📊</div>
          <h3>{{ t('emptyTitle') }}</h3>
          <p>{{ t('emptyDesc') }}</p>
          <button class="btn btn-primary" @click="editMode = true; addWidget()">{{ t('addFirstWidget') }}</button>
        </div>
      </template>

      <!-- No dashboard selected -->
      <div class="empty-state" v-else>
        <div class="icon">📋</div>
        <h3>{{ t('noDashboardSel') }}</h3>
        <p>{{ t('noDashboardSelDesc') }}</p>
        <button class="btn btn-primary" @click="addDashboard">{{ t('createDashboard') }}</button>
      </div>
    </div>
  </div>

  <!-- Widget Config Panel (slide from right) -->
  <template v-if="showConfig">
    <div class="config-overlay" @click="showConfig = false"></div>
    <div class="config-panel">
      <div class="config-panel-header">
        <h3>{{ t('configureWidget') }}</h3>
        <button class="icon-btn" @click="showConfig = false">✕</button>
      </div>
      <div class="config-panel-body">
        <div class="form-group">
          <label class="form-label">{{ t('widgetTitle') }}</label>
          <input class="form-input" v-model="configWidget.title" :placeholder="t('widgetTitlePlaceholder')" />
        </div>
        <div class="form-group">
          <label class="form-label">{{ t('reportType') }}</label>
          <select class="form-select" v-model="configWidget.report_type">
            <option value="distribution">{{ t('typeDistribution') }}</option>
            <option value="created_vs_resolved">{{ t('typeCreatedVsResolved') }}</option>
            <option value="avg_age">{{ t('typeAvgAge') }}</option>
            <option value="current_age">{{ t('typeCurrentAge') }}</option>
            <option value="created_trend">{{ t('typeCreatedTrend') }}</option>
          </select>
        </div>
        <div class="form-group" v-if="configWidget.report_type !== 'created_vs_resolved' && configWidget.report_type !== 'created_trend'">
          <label class="form-label">{{ t('groupBy') }}</label>
          <select class="form-select" v-model="configWidget.group_by">
            <option value="state">{{ t('state') }}</option>
            <option value="priority">{{ t('priority') }}</option>
            <option value="assignee">{{ t('assignee') }}</option>
            <option value="type">{{ t('type') }}</option>
            <option value="label">{{ t('label') }}</option>
            <option value="cycle">{{ t('cycle') }}</option>
            <option value="module">{{ t('module') }}</option>
          </select>
        </div>
        <div class="form-group">
          <label class="form-label">{{ t('chartType') }}</label>
          <div class="toggle-group">
            <button v-for="c in availableCharts" :key="c" class="toggle-btn" :class="{active:configWidget.chart_type===c}" @click="configWidget.chart_type=c">{{ c }}</button>
          </div>
        </div>
        <div class="form-group" v-if="configWidget.report_type === 'created_vs_resolved' || configWidget.report_type === 'created_trend'">
          <label class="form-label">{{ t('interval') }}</label>
          <div class="toggle-group">
            <button v-for="iv in ['Day','Week','Month']" :key="iv" class="toggle-btn" :class="{active:configWidget.interval===iv}" @click="configWidget.interval=iv">{{ iv }}</button>
          </div>
        </div>
        <div style="display:flex;gap:8px;">
          <div class="form-group" style="flex:1">
            <label class="form-label">{{ t('dateFrom') }}</label>
            <input class="form-input" type="date" v-model="configWidget.date_from" />
          </div>
          <div class="form-group" style="flex:1">
            <label class="form-label">{{ t('dateTo') }}</label>
            <input class="form-input" type="date" v-model="configWidget.date_to" />
          </div>
        </div>

        <!-- Filter section — Plane style: chips + inline editor -->
        <div class="form-group">
          <label class="form-label">{{ t('filterMode') }}</label>
          <div class="toggle-group">
            <button class="toggle-btn" :class="{active: filterMode === 'basic'}" @click="filterMode='basic'">{{ t('basicFilters') }}</button>
            <button class="toggle-btn" :class="{active: filterMode === 'rql'}" @click="filterMode='rql'">{{ t('rqlAdvanced') }}</button>
          </div>
        </div>

        <template v-if="filterMode === 'basic'">
          <!-- Condition chips -->
          <div class="filter-chips" v-if="configFilters.length > 0 || editingFilter">
            <span v-for="(f, fi) in configFilters" :key="fi"
              class="filter-chip" @click="startEditFilter(fi)">
              <span class="filter-chip-label">{{ getFieldLabel(f.field) }}</span>
              <span class="filter-chip-op">{{ f.operator }}</span>
              <span class="filter-chip-val">{{ f.displayValue || f.value }}</span>
              <button @click.stop="removeConfigFilter(fi)" class="filter-chip-close">×</button>
            </span>
          </div>

          <!-- Inline editor row (Plane style) -->
          <div v-if="editingFilter" class="filter-editor">
            <span class="filter-editor-label">{{ getFieldLabel(editingFilter.field) || editingFilter.field }}</span>
            <select v-model="editingFilter.operator" class="form-select" style="width:auto;font-size:12px;padding:4px 8px;">
              <option v-for="op in getOperators(editingFilter.field)" :key="op.value" :value="op.value">{{ op.label }}</option>
            </select>
            <select v-if="editingFilter.field === 'state'" v-model="editingFilter.value" class="form-select" style="width:auto;font-size:12px;padding:4px 8px;min-width:100px;">
              <option value="">{{ t('selectValue') }}</option>
              <option value="Backlog">Backlog</option><option value="Todo">Todo</option><option value="In Progress">In Progress</option><option value="In Review">In Review</option><option value="Done">Done</option>
            </select>
            <select v-else-if="editingFilter.field === 'priority'" v-model="editingFilter.value" class="form-select" style="width:auto;font-size:12px;padding:4px 8px;min-width:80px;">
              <option value="">{{ t('selectValue') }}</option>
              <option value="urgent">Urgent</option><option value="high">High</option><option value="medium">Medium</option><option value="low">Low</option>
            </select>
            <input v-else type="text" v-model="editingFilter.value" :placeholder="t('enterValue')" class="form-input" style="flex:1;font-size:12px;padding:4px 8px;" @keydown.enter="confirmEditFilter" />
            <button @click="confirmEditFilter" class="btn btn-sm btn-primary" style="padding:3px 10px;">{{ t('apply') }}</button>
            <button @click="editingFilter = null" class="btn btn-sm btn-ghost" style="padding:3px 10px;">{{ t('cancel') }}</button>
          </div>

          <!-- + Add filter -->
          <div class="filter-add-area">
            <div class="filter-add-row">
              <select v-model="newFilterField" class="form-select" style="width:auto;font-size:12px;" @change="onNewFilterFieldChange">
                <option value="">{{ t('addFilter') }}</option>
                <option value="state">{{ t('state') }}</option>
                <option value="priority">{{ t('priority') }}</option>
                <option value="assignee">{{ t('assignee') }}</option>
                <option value="type">{{ t('type') }}</option>
                <option value="label">{{ t('label') }}</option>
                <option value="cycle">{{ t('cycle') }}</option>
                <option value="module">{{ t('module') }}</option>
                <option value="start_date">{{ t('startDate') }}</option>
                <option value="target_date">{{ t('targetDate') }}</option>
              </select>
              <template v-if="newFilterField">
                <select v-model="newFilterOp" class="form-select" style="width:auto;font-size:12px;padding:4px 8px;">
                  <option v-for="op in getOperators(newFilterField)" :key="op.value" :value="op.value">{{ op.label }}</option>
                </select>
                <select v-if="newFilterField === 'state'" v-model="newFilterVal" class="form-select" style="width:auto;font-size:12px;padding:4px 8px;min-width:100px;">
                  <option value="">{{ t('selectValue') }}</option>
                  <option value="Backlog">Backlog</option><option value="Todo">Todo</option><option value="In Progress">In Progress</option><option value="In Review">In Review</option><option value="Done">Done</option>
                </select>
                <select v-else-if="newFilterField === 'priority'" v-model="newFilterVal" class="form-select" style="width:auto;font-size:12px;padding:4px 8px;min-width:80px;">
                  <option value="">{{ t('selectValue') }}</option>
                  <option value="urgent">Urgent</option><option value="high">High</option><option value="medium">Medium</option><option value="low">Low</option>
                </select>
                <input v-else type="text" v-model="newFilterVal" :placeholder="t('enterValue')" class="form-input" style="flex:1;font-size:12px;padding:4px 8px;" @keydown.enter="commitNewFilter" />
                <button @click="commitNewFilter" class="btn btn-sm btn-primary" style="padding:3px 10px;" :disabled="!newFilterVal">{{ t('apply') }}</button>
              </template>
            </div>
            <span v-if="configFilters.length === 0 && !editingFilter" class="filter-hint">{{ t('noFilters') }}</span>
          </div>
        </template>
        <div v-else class="form-group">
          <input class="form-input rql-input" v-model="configWidget.rql" :placeholder="t('rqlPlaceholder')" />
          <span style="font-size:10px;color:#9ca3af;margin-top:4px;">{{ t('rqlHint') }}</span>
        </div>
        <!-- Size -->
        <div style="display:flex;gap:12px;">
          <div class="form-group" style="flex:1">
            <label class="form-label">{{ t('width') }}</label>
            <select class="form-select" v-model="configWidget.width">
              <option :value="3">Small (3 col)</option>
              <option :value="4">Medium (4 col)</option>
              <option :value="6">Large (6 col)</option>
              <option :value="8">Wide (8 col)</option>
              <option :value="12">Full (12 col)</option>
            </select>
          </div>
          <div class="form-group" style="flex:1">
            <label class="form-label">{{ t('height') }}</label>
            <select class="form-select" v-model="configWidget.height">
              <option :value="1">Compact</option>
              <option :value="2">Normal</option>
              <option :value="3">Tall</option>
            </select>
          </div>
        </div>
      </div>
      <div class="config-panel-footer">
        <button class="btn btn-ghost" @click="showConfig=false">{{ t('cancel') }}</button>
        <button class="btn btn-primary" @click="saveWidgetConfig">{{ t('apply') }}</button>
      </div>
    </div>
  </template>
</div>

<script>
const { createApp, ref, computed, reactive } = Vue

createApp({
  setup() {
    const lang = ref('zh')
    const editMode = ref(false)
    const activeDashboard = ref(0)
    const showConfig = ref(false)
    const configWidgetIdx = ref(-1)
    const filterMode = ref('basic')
    const colors = ['#3B82F6','#10B981','#F59E0B','#EF4444','#8B5CF6','#EC4899','#06B6D4']

    // Plane-style filter state
    const configFilters = ref([])  // [{field, operator, value, displayValue}]
    const editingFilter = ref(null)
    const newFilterField = ref('')
    const newFilterOp = ref('=')
    const newFilterVal = ref('')

    const fieldLabels = {
      state:'State', priority:'Priority', assignee:'Assignee', type:'Type',
      label:'Label', cycle:'Cycle', module:'Module', start_date:'Start Date', target_date:'Target Date'
    }
    function getFieldLabel(f) { return fieldLabels[f] || f }
    function getOperators(field) {
      if (['state','assignee','cycle','module','type'].includes(field)) {
        return [{value:'=',label:'='},{value:'!=',label:'!='},{value:'in',label:'in'},{value:'is_empty',label:'is empty'}]
      }
      if (field === 'priority') {
        return [{value:'=',label:'='},{value:'!=',label:'!='},{value:'in',label:'in'}]
      }
      if (field === 'start_date' || field === 'target_date') {
        return [{value:'=',label:'='},{value:'!=',label:'!='},{value:'>=',label:'>='},{value:'<=',label:'<='},{value:'>',label:'>'},{value:'<',label:'<'},{value:'is_empty',label:'is empty'}]
      }
      return [
        {value:'~',label:'~ (contains)'},{value:'!~',label:'!~ (not contains)'},
        {value:'=',label:'='},{value:'!=',label:'!='},
        {value:'is_empty',label:'is empty'},{value:'is_not_empty',label:'is not empty'}
      ]
    }
    function onNewFilterFieldChange() {
      newFilterOp.value = getOperators(newFilterField.value)[0]?.value || '='
      newFilterVal.value = ''
    }
    function commitNewFilter() {
      if (!newFilterField.value || (!newFilterVal.value && !['is_empty','is_not_empty'].includes(newFilterOp.value))) return
      configFilters.value.push({
        field: newFilterField.value, operator: newFilterOp.value,
        value: newFilterVal.value, displayValue: newFilterVal.value
      })
      newFilterField.value = ''; newFilterOp.value = '='; newFilterVal.value = ''
    }
    function startEditFilter(idx) {
      editingFilter.value = { ...configFilters.value[idx], _idx: idx }
      configFilters.value.splice(idx, 1)
    }
    function confirmEditFilter() {
      if (!editingFilter.value) return
      const f = editingFilter.value
      if (!f.value && !['is_empty','is_not_empty'].includes(f.operator)) { editingFilter.value = null; return }
      configFilters.value.splice(f._idx ?? configFilters.value.length, 0, {
        field: f.field, operator: f.operator, value: f.value, displayValue: f.value
      })
      editingFilter.value = null
    }
    function removeConfigFilter(idx) {
      configFilters.value.splice(idx, 1)
    }

    const tMap = {
      zh: {
        done:'完成编辑', editDashboard:'编辑面板', customAnalytics:'自定义分析', noDashboards:'暂无面板',
        selectDashboard:'选择一个面板', viewing:'查看中', editing:'编辑中', widgets:'Widget',
        totalIssues:'覆盖工作项', group:'分组', count:'数量',
        addWidget:'添加 Widget', emptyTitle:'空白面板', emptyDesc:'点击下方按钮添加第一个分析 Widget', addFirstWidget:'添加第一个 Widget',
        noDashboardSel:'暂无面板', noDashboardSelDesc:'创建第一个面板开始构建自定义分析视图', createDashboard:'创建面板',
        configureWidget:'配置 Widget', widgetTitle:'Widget 标题', widgetTitlePlaceholder:'如: 优先级分布',
        reportType:'报表类型', groupBy:'分组依据', chartType:'图表类型', interval:'时间间隔',
        dateFrom:'开始日期', dateTo:'结束日期', filterMode:'筛选模式',
        basicFilters:'基础筛选', rqlAdvanced:'RQL 高级', selectField:'选择字段', enterValue:'输入值', addFilter:'+ 添加条件',
        rqlPlaceholder:'如: priority = high AND state = "进行中"', rqlHint:'使用 RQL 语法进行高级筛选',
        width:'宽度', height:'高度',
        cancel:'取消', apply:'应用',
        typeDistribution:'分组统计', typeCreatedVsResolved:'创建 vs 解决趋势', typeAvgAge:'平均处理时长', typeCurrentAge:'当前滞留时长', typeCreatedTrend:'创建趋势',
        state:'状态', priority:'优先级', assignee:'负责人', type:'类型', label:'标签', cycle:'周期', module:'模块',
        startDate:'开始日期', targetDate:'截止日期', selectValue:'选择值', noFilters:'无筛选条件',
      },
      en: {
        done:'Done Editing', editDashboard:'Edit Dashboard', customAnalytics:'Custom Analytics', noDashboards:'No dashboards',
        selectDashboard:'Select a dashboard', viewing:'Viewing', editing:'Editing', widgets:'Widgets',
        totalIssues:'Issues Covered', group:'Group', count:'Count',
        addWidget:'Add Widget', emptyTitle:'Empty Dashboard', emptyDesc:'Add your first widget to start building custom analytics', addFirstWidget:'Add First Widget',
        noDashboardSel:'No Dashboards', noDashboardSelDesc:'Create your first dashboard to start building custom analytics views', createDashboard:'Create Dashboard',
        configureWidget:'Configure Widget', widgetTitle:'Widget Title', widgetTitlePlaceholder:'e.g. Priority Distribution',
        reportType:'Report Type', groupBy:'Group By', chartType:'Chart Type', interval:'Interval',
        dateFrom:'Date From', dateTo:'Date To', filterMode:'Filter Mode',
        basicFilters:'Basic Filters', rqlAdvanced:'RQL Advanced', selectField:'Select Field', enterValue:'Enter Value', addFilter:'+ Add Filter',
        rqlPlaceholder:'e.g. priority = high AND state = "In Progress"', rqlHint:'Use RQL syntax for advanced filtering',
        width:'Width', height:'Height',
        cancel:'Cancel', apply:'Apply',
        typeDistribution:'Distribution', typeCreatedVsResolved:'Created vs Resolved', typeAvgAge:'Avg Age', typeCurrentAge:'Current Age', typeCreatedTrend:'Created Trend',
        state:'State', priority:'Priority', assignee:'Assignee', type:'Type', label:'Label', cycle:'Cycle', module:'Module',
        startDate:'Start Date', targetDate:'Target Date', selectValue:'Select value', noFilters:'No filters applied',
      }
    }
    const t = (key) => tMap[lang.value][key] || key

    // Mock data
    const configWidget = reactive({
      title: '', report_type: 'distribution', group_by: 'state',
      chart_type: 'Bar', interval: 'Week',
      date_from: '', date_to: '', rql: '',
      width: 6, height: 2
    })

    const dashboards = ref([{
      name: 'Sprint Health',
      widgets: [
        { title:'状态分布', report_type:'distribution', group_by:'state', chart_type:'Pie', height:2, width:4, rql:'',
          data: {labels:['Backlog','In Progress','In Review','Done','Cancelled'],values:[12,28,15,45,3],total:103}},
        { title:'优先级分布', report_type:'distribution', group_by:'priority', chart_type:'Bar', height:2, width:4, rql:'',
          data: {labels:['Urgent','High','Medium','Low','None'],values:[5,18,42,30,8],total:103}},
        { title:'创建 vs 解决', report_type:'created_vs_resolved', chart_type:'Line', height:2, width:4, interval:'Week', rql:'',
          data: {labels:['W25','W26','W27','W28','W29','W30'],values:[18,22,19,25,20,24],values2:[15,20,18,22,19,21],total:128}},
        { title:'按负责人分布', report_type:'distribution', group_by:'assignee', chart_type:'Table', height:2, width:6, rql:'priority = high',
          data: {labels:['Zhang Wei','Li Na','Wang Fang','Chen Ming','Liu Yang'],values:[22,18,15,12,8],total:75}},
        { title:'当前滞留时长', report_type:'current_age', group_by:'state', chart_type:'Doughnut', height:2, width:6, rql:'',
          data: {labels:['Backlog','In Progress','In Review'],values:[8,12,5],total:25}},
        { title:'创建趋势', report_type:'created_trend', chart_type:'Line', height:2, width:12, interval:'Day', rql:'',
          data: {labels:['6/22','6/23','6/24','6/25','6/26','6/27','6/28'],values:[3,5,4,7,6,8,4],total:37}},
      ]
    }])

    const totalIssues = computed(() => {
      if (!dashboards.value[activeDashboard.value]) return 0
      return dashboards.value[activeDashboard.value].widgets[0]?.data?.total || '—'
    })

    const availableCharts = computed(() => {
      const t = configWidget.report_type
      if (t === 'created_vs_resolved' || t === 'created_trend') return ['Bar','Line','Table']
      return ['Bar','Pie','Doughnut','Table']
    })

    function getSpanClass(w) { return 'col-span-' + (w.width || 6) }
    function getWidgetStyle(w) { return { gridRowEnd: 'span ' + (w.height || 2) } }
    
    function getWidgetBars(w) {
      if (!w.data) return []
      const max = Math.max(...w.data.values, 1)
      return w.data.labels.map((l,i) => ({
        label:l, val:w.data.values[i], pct:Math.round(w.data.values[i]/max*100)
      }))
    }
    function getPieSegments(w) {
      if (!w.data) return []
      const circ = 2 * Math.PI * 28
      const tot = w.data.values.reduce((a,b)=>a+b,1)
      let off = 0
      return w.data.values.map(v => {
        const len = (v/tot)*circ
        const s = { dash: `${len} ${circ-len}`, offset: -off }
        off += len
        return s
      })
    }
    function getLinePoints(w) {
      if (!w.data) return ''
      const vals = w.data.values
      const max = Math.max(...vals,1)
      return vals.map((v,i) => `${20+(260/(vals.length-1||1))*i},${90-(v/max)*75}`).join(' ')
    }
    function getLineDots(w) {
      if (!w.data) return []
      const vals = w.data.values
      const max = Math.max(...vals,1)
      return vals.map((v,i) => ({ x:20+(260/(vals.length-1||1))*i, y:90-(v/max)*75 }))
    }

    function addDashboard() {
      const name = prompt(t('createDashboard') + ' Name:', 'New Dashboard')
      if (name) dashboards.value.push({ name, widgets: [] })
    }
    function addWidget() {
      configWidgetIdx.value = -1
      Object.assign(configWidget, {title:'',report_type:'distribution',group_by:'state',chart_type:'Bar',interval:'Week',date_from:'',date_to:'',rql:'',width:6,height:2})
      configFilters.value = []
      editingFilter.value = null
      newFilterField.value = ''; newFilterOp.value = '='; newFilterVal.value = ''
      filterMode.value = 'basic'
      showConfig.value = true
    }
    function openConfig(idx) {
      configWidgetIdx.value = idx
      const w = dashboards.value[activeDashboard.value].widgets[idx]
      Object.assign(configWidget, {
        title:w.title, report_type:w.report_type, group_by:w.group_by,
        chart_type:w.chart_type, interval:w.interval||'Week',
        date_from:w.date_from||'', date_to:w.date_to||'', rql:w.rql||'',
        width:w.width, height:w.height
      })
      // Restore filters from widget config
      configFilters.value = (w.filters || []).map(function(f) { return {...f} })
      editingFilter.value = null
      newFilterField.value = ''; newFilterOp.value = '='; newFilterVal.value = ''
      filterMode.value = w.rql ? 'rql' : 'basic'
      showConfig.value = true
    }
    function saveWidgetConfig() {
      const dash = dashboards.value[activeDashboard.value]
      const data = {
        title: configWidget.title || configWidget.report_type,
        report_type: configWidget.report_type,
        group_by: configWidget.group_by,
        chart_type: configWidget.chart_type,
        interval: configWidget.interval,
        date_from: configWidget.date_from,
        date_to: configWidget.date_to,
        rql: configWidget.rql,
        width: configWidget.width,
        height: configWidget.height,
        filters: JSON.parse(JSON.stringify(configFilters.value)),
        data: generateMockData(configWidget.report_type, configWidget.group_by, configWidget.chart_type)
      }
      if (configWidgetIdx.value >= 0) {
        dash.widgets[configWidgetIdx.value] = data
      } else {
        dash.widgets.push(data)
      }
      showConfig.value = false
    }
    function removeWidget(idx) {
      if (confirm(t('deleteWidgetConfirm') || 'Delete this widget?')) {
        dashboards.value[activeDashboard.value].widgets.splice(idx, 1)
      }
    }

    function generateMockData(type, groupBy, chart) {
      if (type === 'distribution') {
        if (groupBy === 'state') return {labels:['Backlog','In Progress','In Review','Done','Cancelled'],values:[12,28,15,45,3],total:103}
        if (groupBy === 'priority') return {labels:['Urgent','High','Medium','Low','None'],values:[5,18,42,30,8],total:103}
        if (groupBy === 'assignee') return {labels:['Zhang Wei','Li Na','Wang Fang','Chen Ming','Liu Yang'],values:[22,18,15,12,8],total:75}
        return {labels:['Bug','Feature','Improvement','Task'],values:[20,45,25,13],total:103}
      }
      if (type === 'created_vs_resolved') return {
        labels:['W25','W26','W27','W28','W29','W30'],values:[18,22,19,25,20,24],values2:[15,20,18,22,19,21],total:128
      }
      if (type === 'avg_age') return {labels:['Bug','Feature','Improvement'],values:[3.2,8.5,5.1],total:103,summary:{avg_days:5.6}}
      if (type === 'current_age') return {labels:['Backlog','In Progress','In Review'],values:[8,12,5],total:25}
      if (type === 'created_trend') return {
        labels:['6/22','6/23','6/24','6/25','6/26','6/27','6/28'],values:[3,5,4,7,6,8,4],total:37
      }
      return {labels:[],values:[],total:0}
    }

    function startDrag(e, idx) {}
    function startResize(e, idx) {}

    return { lang, t, editMode, activeDashboard, showConfig, configWidgetIdx, filterMode, configFilters, editingFilter, newFilterField, newFilterOp, newFilterVal, configWidget,
      colors, dashboards, totalIssues, availableCharts,
      getSpanClass, getWidgetStyle, getWidgetBars, getPieSegments, getLinePoints, getLineDots,
      addDashboard, addWidget, openConfig, saveWidgetConfig, removeWidget, startDrag, startResize,
      getFieldLabel, getOperators, onNewFilterFieldChange, commitNewFilter, startEditFilter, confirmEditFilter, removeConfigFilter
    }
  }
}).mount('#app')
</script>

</body>
</html>
