<!DOCTYPE html>
<html>
<body>
<script>
const rql = '(name LIKE "%测试%" OR description LIKE "%测试%")';
const params = new URLSearchParams();
params.append('rql', rql);
console.log('URLSearchParams result:', params.toString());

const encodedRQL = encodeURIComponent(rql);
console.log('encodeURIComponent result:', encodedRQL);

params.delete('rql');
params.append('rql', encodedRQL);
console.log('Double encoded:', params.toString());
</script>
</body>
</html>
