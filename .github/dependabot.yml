version: 2

# Weekly, grouped updates. The point is to know when a dependency rots, not to
# open a PR per module every Monday: minor and patch bumps arrive as one PR per
# ecosystem, majors arrive on their own so they can be read.
updates:
  - package-ecosystem: gomod
    directory: /backend
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      go-minor-patch:
        patterns: ['*']
        update-types: [minor, patch]

  - package-ecosystem: gomod
    directory: /sdk
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    groups:
      go-minor-patch:
        patterns: ['*']
        update-types: [minor, patch]

  - package-ecosystem: gomod
    directory: /tests
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    groups:
      go-minor-patch:
        patterns: ['*']
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      npm-minor-patch:
        patterns: ['*']
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /sdk/node
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    groups:
      npm-minor-patch:
        patterns: ['*']
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /tests
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    groups:
      npm-minor-patch:
        patterns: ['*']
        update-types: [minor, patch]

  # Actions are pinned by tag (actions/checkout@v4); this keeps them current
  # with the Node.js runtime GitHub deprecates.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      actions:
        patterns: ['*']

  - package-ecosystem: docker
    directory: /backend
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3

  - package-ecosystem: docker
    directory: /frontend
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
