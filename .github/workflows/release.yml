name: Release

# Publishing is tag-driven: `git tag v0.1.0 && git push <remote> v0.1.0`.
# CI (.github/workflows/ci.yml) has already built both images without pushing,
# so a failure here is about the registry, multi-arch wrapping, or the release
# notes — not about whether the code compiles.

on:
  push:
    tags: ['v*']

permissions:
  contents: write   # create the GitHub Release
  packages: write   # push to ghcr.io

env:
  REGISTRY: ghcr.io
  IMAGE_NAMESPACE: ghcr.io/vinthuy

jobs:
  images:
    name: Publish ${{ matrix.component }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        component: [backend, frontend]
    steps:
      - uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # semver tags: v0.1.0 -> 0.1.0, 0.1 (latest only for non-prereleases).
      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_NAMESPACE }}/reqmango-${{ matrix.component }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}

      - name: Build metadata
        id: build
        run: |
          echo "date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Build and push (linux/amd64, linux/arm64)
        uses: docker/build-push-action@v7
        with:
          context: ./${{ matrix.component }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ github.ref_name }}
            COMMIT=${{ steps.build.outputs.sha }}
            BUILD_DATE=${{ steps.build.outputs.date }}
          provenance: true
          sbom: true

  release:
    name: GitHub Release
    needs: images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # The release body is the matching CHANGELOG section, prefixed with the
      # image coordinates so a reader can pull without cloning.
      - name: Compose release notes
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          {
            echo "### Container images"
            echo
            echo '```'
            echo "docker pull ghcr.io/vinthuy/reqmango-backend:${version}"
            echo "docker pull ghcr.io/vinthuy/reqmango-frontend:${version}"
            echo '```'
            echo
            echo "Or, from a checkout: \`REQMANGO_TAG=${version} docker compose pull && REQMANGO_TAG=${version} docker compose up -d\`"
            echo
            awk -v v="$version" '
              index($0, "## [" v "]") == 1 { flag = 1; next }
              /^## \[/ { flag = 0 }
              flag
            ' CHANGELOG.md > /tmp/section.md
            if [ -s /tmp/section.md ]; then
              cat /tmp/section.md
            else
              echo "See [CHANGELOG.md](https://github.com/${GITHUB_REPOSITORY}/blob/master/CHANGELOG.md)."
            fi
          } > /tmp/release-notes.md
          head -20 /tmp/release-notes.md

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          args=(--title "Reqmango ${GITHUB_REF_NAME}" --notes-file /tmp/release-notes.md)
          case "${GITHUB_REF_NAME}" in
            *-*) args+=(--prerelease) ;;
          esac
          gh release create "${GITHUB_REF_NAME}" "${args[@]}"
