name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

env:
  # Must satisfy the `go` directive in backend/go.mod (currently 1.25.0).
  GO_VERSION: '1.25'
  GOLANGCI_LINT_VERSION: 'v2.13.2'
  GITLEAKS_VERSION: '8.28.0'

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # The Go module lives in backend/, so setup-go's default "look for go.sum
      # at the repository root" never resolved: every job logged "Restore cache
      # failed" and re-downloaded the module cache. The jobs below pin
      # cache-dependency-path for the same reason.
      - uses: actions/setup-go@v7
        with:
          go-version: '${{ env.GO_VERSION }}'
          cache-dependency-path: backend/go.sum

      # backend/.golangci.yml enables gosec (hardcoded credentials, SSRF, command
      # injection, integer overflow, insecure file permissions, ...) and bodyclose.
      - name: golangci-lint (includes gosec)
        uses: golangci/golangci-lint-action@v9
        with:
          version: ${{ env.GOLANGCI_LINT_VERSION }}
          working-directory: backend
          args: --timeout=5m

      - uses: actions/setup-node@v7
        with: { node-version: '20' }

      - name: Install frontend deps
        run: cd frontend && npm ci

      - name: Frontend type-check
        run: cd frontend && npx vue-tsc --noEmit

      - name: Frontend translation keys
        run: cd frontend && npm run i18n:check

  security:
    name: Security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: '${{ env.GO_VERSION }}'
          cache-dependency-path: backend/go.sum

      # gosec runs in the Lint job. This job covers the complementary controls:
      # committed credentials and known vulnerabilities in dependencies.
      - name: Install gitleaks
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | sudo tar -xz -C /usr/local/bin gitleaks
          gitleaks version

      # Fails on any new credential material. Audited false positives are listed
      # with their justification in .gitleaks.toml.
      - name: Scan for committed secrets (gitleaks)
        run: gitleaks dir . --config .gitleaks.toml --redact --no-banner

      # Advisory: reports vulnerabilities reachable from this module. Kept
      # non-blocking because standard-library findings depend on the exact Go
      # patch release installed by setup-go rather than on this repository.
      - name: Go vulnerability check (advisory)
        working-directory: backend
        continue-on-error: true
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.1.4 ./...

  test:
    name: Test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: reqmango
          POSTGRES_PASSWORD: reqmango
          POSTGRES_DB: reqmango_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: '${{ env.GO_VERSION }}'
          cache-dependency-path: backend/go.sum

      - name: Go tests
        env:
          TEST_DATABASE_URL: postgres://reqmango:reqmango@localhost:5432/reqmango_test?sslmode=disable
        run: |
          cd backend
          go test -race -coverprofile=coverage.out ./internal/...
          go tool cover -func=coverage.out | tail -1

      - uses: actions/setup-node@v7
        with: { node-version: '20' }

      - name: Install frontend deps
        run: cd frontend && npm ci

      # @vitest/coverage-v8 supplies the provider required by --coverage.
      - name: Frontend tests
        run: cd frontend && npx vitest run --coverage

  e2e:
    name: E2E
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: reqmango
          POSTGRES_PASSWORD: reqmango
          POSTGRES_DB: reqmango_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: '${{ env.GO_VERSION }}'
          cache-dependency-path: backend/go.sum

      - uses: actions/setup-node@v7
        with: { node-version: '20' }

      - name: Install frontend deps
        run: cd frontend && npm ci

      - name: Install Playwright Chromium
        run: cd frontend && npx playwright install chromium --with-deps

      - name: Build frontend
        run: cd frontend && npx vite build

      - name: Build backend
        working-directory: backend
        run: go build -o ../backend-server ./cmd/server

      # The database is owned by the POSTGRES_USER. Grant extra permissions
      # so GORM's AutoMigrate (which uses ALTER TABLE) succeeds.
      - name: Grant database permissions
        run: |
          PGPASSWORD=reqmango psql -h localhost -U reqmango -d reqmango_test -c "
            ALTER DATABASE reqmango_test OWNER TO reqmango;
            ALTER SCHEMA public OWNER TO reqmango;
            GRANT ALL PRIVILEGES ON ALL TABLES IN SCHEMA public TO reqmango;
            GRANT ALL PRIVILEGES ON ALL SEQUENCES IN SCHEMA public TO reqmango;
            GRANT ALL PRIVILEGES ON SCHEMA public TO reqmango;
          "

      # The server auto-migrates and seeds demo data (admin@reqmango.com,
      # reqmango-dev workspace, CORE project). Raise the rate limit so the
      # E2E suite's burst traffic doesn't get 429-rejected.
      - name: Start backend
        env:
          DATABASE_URL: postgres://reqmango:reqmango@localhost:5432/reqmango_test?sslmode=disable
          RATE_LIMIT_REQUESTS: '200000'
          SECRET_KEY: ci-e2e-secret-key-not-for-production
          DEBUG: 'false'
          DB_LOG_LEVEL: 'warn'
          # Demo accounts are opt-in; the suite logs in as admin@reqmango.com.
          SEED_DEMO: 'true'
        run: |
          cd backend
          ../backend-server &
          # Wait for readiness (/readyz pings the database), falling back to the
          # full seed delay on a cold database.
          for i in $(seq 1 120); do
            if curl -sf http://localhost:8000/readyz >/dev/null 2>&1; then
              echo "backend ready after $((i*2))s"
              break
            fi
            sleep 2
          done

      # vite preview proxies /api to :8000 (see frontend/vite.config.ts).
      - name: Start frontend preview
        run: |
          cd frontend
          npx vite preview --port 5173 --strictPort &
          sleep 3
          echo "preview started"

      - name: Generate E2E test token
        run: |
          TOKEN=$(curl -s http://localhost:5173/api/v1/auth/login \
            -H 'Content-Type: application/json' \
            -d '{"email":"admin@reqmango.com","password":"demo1234"}' \
            | python3 -c "import sys,json; print(json.load(sys.stdin)['access_token'])")
          echo "TEST_TOKEN=$TOKEN" >> "$GITHUB_ENV"
          echo "token generated ($(echo $TOKEN | wc -c) chars)"

      - name: Run Playwright E2E tests (chromium)
        working-directory: frontend
        env:
          CI: 'true'
        run: npx playwright test --project=chromium

      - name: Upload test report on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7

      - name: Upload test results on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: frontend/test-results/
          retention-days: 3

  audit:
    name: Tenancy audit
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: reqmango
          POSTGRES_PASSWORD: reqmango
          POSTGRES_DB: reqmango_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: '${{ env.GO_VERSION }}'
          cache-dependency-path: backend/go.sum

      - name: Grant database permissions
        run: |
          PGPASSWORD=reqmango psql -h localhost -U reqmango -d reqmango_test -c "
            ALTER DATABASE reqmango_test OWNER TO reqmango;
            ALTER SCHEMA public OWNER TO reqmango;
            GRANT ALL PRIVILEGES ON ALL TABLES IN SCHEMA public TO reqmango;
            GRANT ALL PRIVILEGES ON ALL SEQUENCES IN SCHEMA public TO reqmango;
            GRANT ALL PRIVILEGES ON SCHEMA public TO reqmango;
          "

      # The audit needs a populated victim tenant. Start the server once to
      # migrate and seed, wait for readiness, then stop it; the copy below is
      # what every probe mode runs against.
      - name: Migrate and seed a disposable tenant
        env:
          DATABASE_URL: postgres://reqmango:reqmango@localhost:5432/reqmango_test?sslmode=disable
          RATE_LIMIT_REQUESTS: '200000'
          SECRET_KEY: ci-audit-secret-key-not-for-production
          DEBUG: 'false'
          DB_LOG_LEVEL: 'error'
          # The probes need a populated tenant (members, projects, issues).
          SEED_DEMO: 'true'
        run: |
          cd backend
          go build -o ../audit-seed-server ./cmd/server
          ../audit-seed-server > /tmp/audit-seed.log 2>&1 &
          for i in $(seq 1 120); do
            if curl -sf http://localhost:8000/readyz >/dev/null 2>&1; then
              echo "seeded after $((i*2))s"
              break
            fi
            sleep 2
          done
          curl -sf http://localhost:8000/readyz >/dev/null
          pkill -f audit-seed-server || true
          sleep 2

      - name: Copy the seeded database
        run: |
          PGPASSWORD=reqmango createdb -h localhost -U reqmango reqmango_audit
          PGPASSWORD=reqmango pg_dump -h localhost -U reqmango reqmango_test \
            | PGPASSWORD=reqmango psql -q -h localhost -U reqmango -d reqmango_audit

      # Each mode copies the seeded database again, because the audit mutates
      # what it probes. -strict turns any XTENANT / ESCALATE / LEAK / WRITE,
      # unresolved route or 500 into a non-zero exit.
      - name: Probe every route in all four modes
        env:
          PGPASSWORD: reqmango
          ROUTE_AUDIT_DATABASE_URL: postgres://reqmango:reqmango@localhost:5432/reqmango_audit?sslmode=disable
        run: |
          mkdir -p /tmp/audit
          run_mode() {
            name=$1; shift
            PGPASSWORD=reqmango psql -q -h localhost -U reqmango \
              -c "DROP DATABASE IF EXISTS reqmango_audit" \
              -c "CREATE DATABASE reqmango_audit" postgres
            PGPASSWORD=reqmango pg_dump -h localhost -U reqmango reqmango_test \
              | PGPASSWORD=reqmango psql -q -h localhost -U reqmango -d reqmango_audit
            echo "===== $name ====="
            (cd backend && go run ./cmd/route_audit -workspace 1 -seed "$@" \
              -strict -out "/tmp/audit/$name.md")
          }
          run_mode base
          run_mode no-query -no-query
          run_mode member -member
          run_mode cross -cross

      - name: Upload audit reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: route-audit
          path: /tmp/audit/
          retention-days: 7

  migrate:
    name: Migration path
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: reqmango
          POSTGRES_PASSWORD: reqmango
          POSTGRES_DB: reqmango_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: '${{ env.GO_VERSION }}'
          cache-dependency-path: backend/go.sum

      - name: Grant database permissions
        run: |
          PGPASSWORD=reqmango psql -h localhost -U reqmango -d reqmango_test -c "
            ALTER DATABASE reqmango_test OWNER TO reqmango;
            ALTER SCHEMA public OWNER TO reqmango;
          "

      # Production applies migrations and then the server runs AutoMigrate over
      # the same tables. The two disagree on constraint names (SQL uses Postgres
      # defaults, GORM uses uni_<table>_<column>), so only this order catches a
      # tag GORM would try to drop. Booting on an empty database — what every
      # other job does — hides it.
      - name: Apply the baseline
        env:
          DATABASE_URL: postgres://reqmango:reqmango@localhost:5432/reqmango_test?sslmode=disable
        run: |
          cd backend
          go run ./cmd/migrate up
          # Re-running must be a no-op (the baseline is idempotent).
          go run ./cmd/migrate up

      - name: Start the server over the migrated schema
        env:
          DATABASE_URL: postgres://reqmango:reqmango@localhost:5432/reqmango_test?sslmode=disable
          RATE_LIMIT_REQUESTS: '200000'
          SECRET_KEY: ci-migrate-secret-key-not-for-production
          DEBUG: 'false'
          DB_LOG_LEVEL: 'error'
        run: |
          cd backend
          go build -o ../migrate-server ./cmd/server
          ../migrate-server > /tmp/migrate-server.log 2>&1 &
          for i in $(seq 1 90); do
            if curl -sf http://localhost:8000/readyz >/dev/null 2>&1; then
              echo "server ready after $((i*2))s"
              exit 0
            fi
            sleep 2
          done
          echo "server did not become ready; last log lines:"
          tail -40 /tmp/migrate-server.log
          exit 1

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint, security, test, e2e, audit, migrate]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: '${{ env.GO_VERSION }}'
          cache-dependency-path: backend/go.sum

      - name: Build backend
        run: cd backend && go build -ldflags="-s -w" ./cmd/server

      - uses: actions/setup-node@v7
        with: { node-version: '20' }

      - name: Install frontend deps
        run: cd frontend && npm ci

      - name: Build frontend
        run: cd frontend && npx vite build

  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [build]
    # Release tags are covered by release.yml, which builds and pushes both
    # images for real.
    if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
    # The matrix produces the check names "Docker Build (backend)" and
    # "Docker Build (frontend)", and both are required status checks on
    # master. Renaming the job or touching the matrix silently disables that
    # half of the gate, so update the branch protection rule in the same
    # change (docs/dev/dual-remote.md lists the current rule).
    strategy:
      fail-fast: false
      matrix:
        component: [backend, frontend]
    steps:
      - uses: actions/checkout@v7

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      # No push here: this only proves both images still build from their own
      # context. Publishing happens on a v* tag in release.yml.
      - name: Build ${{ matrix.component }} image (amd64)
        uses: docker/build-push-action@v7
        with:
          context: ./${{ matrix.component }}
          platforms: linux/amd64
          push: false
          tags: reqmango-${{ matrix.component }}:ci
          build-args: |
            VERSION=ci
            COMMIT=${{ github.sha }}
            BUILD_DATE=ci
