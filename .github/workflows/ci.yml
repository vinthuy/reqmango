name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

env:
  # Must satisfy the `go` directive in backend/go.mod (currently 1.25.0).
  GO_VERSION: '1.25'
  GOLANGCI_LINT_VERSION: 'v2.13.2'
  GITLEAKS_VERSION: '8.28.0'

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with: { go-version: '${{ env.GO_VERSION }}' }

      # backend/.golangci.yml enables gosec (hardcoded credentials, SSRF, command
      # injection, integer overflow, insecure file permissions, ...) and bodyclose.
      - name: golangci-lint (includes gosec)
        uses: golangci/golangci-lint-action@v9
        with:
          version: ${{ env.GOLANGCI_LINT_VERSION }}
          working-directory: backend
          args: --timeout=5m

      - uses: actions/setup-node@v4
        with: { node-version: '20' }

      - name: Install frontend deps
        run: cd frontend && npm ci

      - name: Frontend type-check
        run: cd frontend && npx vue-tsc --noEmit

  security:
    name: Security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with: { go-version: '${{ env.GO_VERSION }}' }

      # gosec runs in the Lint job. This job covers the complementary controls:
      # committed credentials and known vulnerabilities in dependencies.
      - name: Install gitleaks
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | sudo tar -xz -C /usr/local/bin gitleaks
          gitleaks version

      # Fails on any new credential material. Audited false positives are listed
      # with their justification in .gitleaks.toml.
      - name: Scan for committed secrets (gitleaks)
        run: gitleaks dir . --config .gitleaks.toml --redact --no-banner

      # Advisory: reports vulnerabilities reachable from this module. Kept
      # non-blocking because standard-library findings depend on the exact Go
      # patch release installed by setup-go rather than on this repository.
      - name: Go vulnerability check (advisory)
        working-directory: backend
        continue-on-error: true
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.1.4 ./...

  test:
    name: Test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: reqmango
          POSTGRES_PASSWORD: reqmango
          POSTGRES_DB: reqmango_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with: { go-version: '${{ env.GO_VERSION }}' }

      - name: Go tests
        run: |
          cd backend
          go test -race -coverprofile=coverage.out ./internal/...
          go tool cover -func=coverage.out | tail -1

      - uses: actions/setup-node@v4
        with: { node-version: '20' }

      - name: Install frontend deps
        run: cd frontend && npm ci

      # @vitest/coverage-v8 supplies the provider required by --coverage.
      - name: Frontend tests
        run: cd frontend && npx vitest run --coverage

  e2e:
    name: E2E
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: reqmango
          POSTGRES_PASSWORD: reqmango
          POSTGRES_DB: reqmango_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with: { go-version: '${{ env.GO_VERSION }}' }

      - uses: actions/setup-node@v4
        with: { node-version: '20' }

      - name: Install frontend deps
        run: cd frontend && npm ci

      - name: Install Playwright Chromium
        run: cd frontend && npx playwright install chromium --with-deps

      - name: Build frontend
        run: cd frontend && npx vite build

      - name: Build backend
        working-directory: backend
        run: go build -o ../backend-server ./cmd/server

      # The database is owned by the POSTGRES_USER. Grant extra permissions
      # so GORM's AutoMigrate (which uses ALTER TABLE) succeeds.
      - name: Grant database permissions
        run: |
          PGPASSWORD=reqmango psql -h localhost -U reqmango -d reqmango_test -c "
            ALTER DATABASE reqmango_test OWNER TO reqmango;
            ALTER SCHEMA public OWNER TO reqmango;
            GRANT ALL PRIVILEGES ON ALL TABLES IN SCHEMA public TO reqmango;
            GRANT ALL PRIVILEGES ON ALL SEQUENCES IN SCHEMA public TO reqmango;
            GRANT ALL PRIVILEGES ON SCHEMA public TO reqmango;
          "

      # The server auto-migrates and seeds demo data (admin@reqmango.com,
      # reqmango-dev workspace, CORE project). Raise the rate limit so the
      # E2E suite's burst traffic doesn't get 429-rejected.
      - name: Start backend
        env:
          DATABASE_URL: postgres://reqmango:reqmango@localhost:5432/reqmango_test?sslmode=disable
          RATE_LIMIT_REQUESTS: '200000'
          SECRET_KEY: ci-e2e-secret-key-not-for-production
          DEBUG: 'false'
          DB_LOG_LEVEL: 'warn'
        run: |
          cd backend
          ../backend-server &
          # Wait for the backend to be ready (seed can take ~60 s on first run).
          for i in $(seq 1 120); do
            curl -s http://localhost:8000/api/v1/workspaces >/dev/null 2>&1 && break
            sleep 2
          done
          echo "backend ready after $((i*2))s"

      # vite preview proxies /api to :8000 (see frontend/vite.config.ts).
      - name: Start frontend preview
        run: |
          cd frontend
          npx vite preview --port 5173 --strictPort &
          sleep 3
          echo "preview started"

      - name: Generate E2E test token
        run: |
          TOKEN=$(curl -s http://localhost:5173/api/v1/auth/login \
            -H 'Content-Type: application/json' \
            -d '{"email":"admin@reqmango.com","password":"demo1234"}' \
            | python3 -c "import sys,json; print(json.load(sys.stdin)['access_token'])")
          echo "TEST_TOKEN=$TOKEN" >> "$GITHUB_ENV"
          echo "token generated ($(echo $TOKEN | wc -c) chars)"

      - name: Run Playwright E2E tests (chromium)
        working-directory: frontend
        env:
          CI: 'true'
        run: npx playwright test --project=chromium

      - name: Upload test report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7

      - name: Upload test results on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: frontend/test-results/
          retention-days: 3

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint, security, test, e2e]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with: { go-version: '${{ env.GO_VERSION }}' }

      - name: Build backend
        run: cd backend && go build -ldflags="-s -w" ./cmd/server

      - uses: actions/setup-node@v4
        with: { node-version: '20' }

      - name: Install frontend deps
        run: cd frontend && npm ci

      - name: Build frontend
        run: cd frontend && npx vite build

  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [build]
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: reqmango:latest
