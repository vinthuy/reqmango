name: Delete rehearsal package versions

# One-shot: remove the v0.0.0-rc.1 images that GitHub still shows as the
# newest package version after the release and git tag were deleted.
on:
  workflow_dispatch:

permissions:
  packages: write

jobs:
  delete:
    runs-on: ubuntu-24.04
    steps:
      - name: Delete 0.0.0-rc.1 package versions
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          delete() {
            local pkg="$1" id="$2"
            echo "DELETE $pkg $id"
            gh api --method DELETE \
              -H "Accept: application/vnd.github+json" \
              "/users/vinthuy/packages/container/${pkg}/versions/${id}"
          }
          delete reqmango-backend 1441740202
          delete reqmango-frontend 1441739794
