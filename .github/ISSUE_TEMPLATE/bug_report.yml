name: Bug report
description: Something is broken or behaves incorrectly
title: "[bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Clear repro steps help us fix faster.
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What went wrong in one or two sentences?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: Numbered steps from a clean or demo login if possible.
      placeholder: |
        1. docker compose up --build
        2. Login as demo@example.com
        3. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: Include screenshots or the exact UI string (e.g. raw i18n key) if relevant.
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - frontend
        - backend
        - docker / deploy
        - docs
        - unsure
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: Environment
      description: "e.g. Docker Compose / local Go 1.25 + Node 20, OS, browser"
    validations:
      required: false
