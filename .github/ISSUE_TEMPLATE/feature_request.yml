name: Feature request
description: Propose a focused improvement (discuss large ideas in Discussions first)
title: "[feat] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Prefer small, shippable ideas aligned with **AI in the PM loop** (Issue / Intake / Cycle / Pages).
        Large platform / Agent-console expansions should start in Discussions.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What user pain does this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: Concrete behavior change. Who benefits?
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Out of scope
      description: What this request deliberately does **not** include.
    validations:
      required: false
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - frontend
        - backend
        - docker / deploy
        - docs / i18n
        - unsure
    validations:
      required: true
